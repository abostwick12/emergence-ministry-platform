<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --navy: #07162F;
        --ink: #102033;
        --muted: #526170;
        --line: #DDE7EC;
        --soft: #F1F7FA;
        --teal: #007C89;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background: #F7FAFC;
      }
      .wrap { padding: 20px; }
      .brand { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 16px; }
      h1 { margin: 0; color: var(--navy); font-size: 28px; line-height: 1; }
      .subtitle { margin-top: 7px; color: var(--teal); font-size: 12px; font-weight: 700; }
      .status {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        line-height: 1.45;
        box-shadow: 0 8px 20px rgba(7, 22, 47, .07);
      }
      .label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
      .actions { display: grid; gap: 8px; margin-top: 16px; }
      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--navy);
        font-weight: 700;
        text-align: left;
        padding: 0 12px;
      }
      button.primary { background: var(--teal); color: #fff; border-color: var(--teal); text-align: center; }
      .note { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <h1><?= status.assistantName ?></h1>
        <div class="subtitle">Your Emerge Ministry Momentum Assistant</div>
      </div>
      <div class="status">
        <div class="label">Environment</div>
        <strong><?= environment ?></strong>
        <p><?= status.message ?></p>
      </div>
      <div class="actions">
        <? for (var i = 0; i < status.quickActions.length; i++) { ?>
          <button onclick="google.script.run.showComingSoon('<?= status.quickActions[i] ?>', 'a later build')">
            <?= status.quickActions[i] ?>
          </button>
        <? } ?>
        <button class="primary" onclick="google.script.run.runPackageOneSmokeTest()">Run smoke test</button>
      </div>
      <div class="note">
        EMMA will not call Gemini, draft messages, send communication, or invent missing ministry details in Package 1.
      </div>
    </div>
  </body>
</html>
